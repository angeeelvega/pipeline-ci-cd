services:
  jenkins:
    build: .
    container_name: jenkins-local
    ports:
      # 8081 porque el 8080 lo usa el frontend de la app (docker-compose.yml de la raíz).
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
