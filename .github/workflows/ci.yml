name: CI

# Integración continua: se ejecuta en cada push y en cada pull request hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (verificación de tipos)
        run: npx tsc --noEmit

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar
        run: npm run build

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # "npm run build" ejecuta tsc --noEmit (análisis de tipos) y vite build.
      - name: Verificar tipos y compilar
        run: npm run build

  docker:
    name: Validar imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen del backend (sin publicar)
        run: docker build -t pipeline-api:ci ./backend

      - name: Construir imagen del frontend (sin publicar)
        run: docker build -t pipeline-web:ci ./frontend
