services:
  api:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
